class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (m && /^(checked|disabled|selected)$/i.test(a.name)) { var bv = !!get(m[1], scopes); el.removeAttribute(a.name); if (bv) el.setAttribute(a.name, ''); return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    var mount = function () { comp = new Component({}); window.__dcRender(); };
    // Server rejimi: api/state varsa, bütün ekranlar eyni (paylaşılan) məlumatla işləyir; yoxdursa (GitHub) — nümunə rejimi
    var done = false, go = function (s) { if (done) return; done = true; window.ORCHARD = (s && s.server) ? s : undefined; mount(); };
    setTimeout(function () { go(null); }, 2500);
    fetch('api/state', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(go);
  });
})();

var DF = {"E": [["24.03", "Bütün bağ", "Bordo 50% — 5 kq/ha, cəmi 40 kq", "Eyni (jurnala bu dəftərdən salınıb)", "Yaxşı", "Erkən mis qoruması. 40 kq ÷ 5 kq = 8 ha — bloklarınızın sahəsi (7,9 ha) ilə üst-üstə düşür, yəni norma düz saxlanıb. Türkiyə təlimatı da tumurcuqlar şişəndə bordo verir."], ["29.03", "Gala + Roza", "Yalnız tarix və blok; dərmanı 31.03-dəki ilə eynidir (ox ilə göstərilib)", "FƏRQ: WhatsApp-da 30.03 Fuji, 31.03 Gala + Roza; dəftərdə 29.03 Gala + Roza, 31.03 Fuji", "Yoxlanmalı", "Tarix 1–2 gün fərqlənir. Qara ləkə hesabında \"son qoruma nə vaxt idi\" sualı üçün dəqiq tarix lazımdır. Bundan sonra tarixi bir yerdə yazın."], ["31.03", "Fuji", "Mankozeb 2 kq, lyambda-sihalotrin 300 q", "Eyni (WhatsApp-da 30.03)", "Artıq", "Mankozeb düzdür. Piretroid (lyambda) bu fazada lazım deyildi: zərərverici sayılmayıb, faydalı həşəratı qırır. Doza da reyestrdəkindən 1,2–1,5 dəfə çoxdur."], ["01.04", "Fuji", "Yazlıq yağ 20 l, piriproksifen 0,5 l, azot turşusu 250 q/1 t; faza C3", "FƏRQ: dəftərdə faza C3, WhatsApp-da \"D-yə keçir\"", "Yoxlanmalı", "Yağ + piriproksifen qışlayan yumurtalara qarşıdır və yalnız çiçəkləmədən əvvəl vurulur (İtaliya qaydası: ildə 1 dəfə, çiçəkdən əvvəl). C3-də vurulubsa vaxt normaldır, D-də gecdir. Əvvəlki \"Səhv\" qiyməti fazanın kim tərəfindən düz yazıldığından asılıdır — fenologiya fotosu olsa, dəqiqləşər."], ["01.04", "Təzə qələmlər", "Mankozeb, kükürd; faza D", "YENİ — WhatsApp-da yoxdur (orada 29.03 təzə qələmlərə yağ yazılıb)", "Yaxşı", "İki kontakt dərman: mankozeb qara ləkəyə, kükürd un şehinə. Miqdar yazılmayıb."], ["03.04", "Bütün bağ", "Mankozeb 2 kq/ha, penkonazol 400 q/ha, azot turşusu; faza D–D3", "Eyni", "Yaxşı", "Kontakt + sistemik, yağışdan əvvəl. Mankozeb və penkonazol normaları reyestrə uyğundur."], ["07.04", "Bütün bağ", "Mankozeb 2 kq, bor 1 l, aminoqol 1 l /ha; fosfor turşusu 250 q/2 t; E–E2", "Eyni", "Yaxşı", "Kontakt qoruma, norma uyğundur."], ["11.04", "Roza", "Siprodinil 400 q, aminoqol 1 l, penkonazol 400 q; F", ", "Ditianon 500 q, difenokonazol 500 q, mikroelement 2 kq", "Eyni", "Normal", "Yağışdan əvvəl qabaqlayıcı — vaxt çox yaxşıdır. Difenokonazol dozası yüksəkdir."], ["19.05", "Bütün bağ", "Kaptan 2 kq, kresoksim-metil 300 q, mikroelement 2 kq, izabion 2 l", "Eyni", "Yaxşı", "Doludan sonra, kontakt partnyorla."], ["23.05", "Bütün bağ", "Kaptan 2 kq, bupirimat 0,5 l /1 t; abamektin + etoksazol 750 q", "FƏRQ: WhatsApp-da yalnız abamektin + etoksazol 1,5 l; dəftərə görə fungisid də qatılıb", "Yoxlanmalı", "Fungisid qatılıbsa, WhatsApp-dakı \"yağışlı dövrdə fungisid qatılmayıb\" qeydi düz deyil — yaxşı xəbərdir. Gənə sayı yenə yazılmayıb (hədd: yarpaqda 8–10 gənə)."], ["26.05", "Bütün bağ", "Tiofanat-metil 1,5 kq, difenokonazol 0,5 l, deltametrin 0,5 l, mikroelement 2 kq", "Eyni", "Səhv", "Kontaktsız iki sistemik, ikisi də yüksək dozada; deltametrin 0,5 l — reyestrdə 25 q/l preparat üçün 0,1–0,35 l: 1,4–5 dəfə çox. Piretroidlər faydalı gənələri qırır — yayda gənə partlayışının mümkün səbəblərindən biri."], ["03.06", "Bütün bağ", "Kaptan 2 kq, trifloksistrobin 200 q, tiakloprid 500 q, dəniz yosunu 2 l, mikroelement 2 kq; pH 250 q", "Eyni", "Normal", "Kontaktla QoI — düzgün birləşmə. Trifloksistrobin 1,3 dəfə reyestrdən çox."], ["05.06", "Bütün bağ", "Kalsi-bor 3 l", "Eyni", "Yaxşı", "Acı ləkəyə qarşı kalsium çiləmələrinin başlanğıcı."], ["08.06", "Gala + Roza", "Kaptan, difenokonazol, dəniz yosunu", "Eyni", "Normal", "Miqdar yazılmayıb."], ["08.06", "Fuji", "Malatyon 2 l, dimetoat 1,5 l, xlorpirifos-etil 0,5 l, mikroelement 2 kq", "Eyni", "Səhv", "1) XLORPİRİFOS-ETİL Azərbaycanda 01.01.2024-dən QADAĞANDIR (AQTA). 2) Üç dərmanın üçü də eyni qrupdandır (IRAC 1B) — birlikdə vurmağın faydası yoxdur. 3) Dimetoat 1,5 l — reyestrdə 0,8–1,2 l."], ["09.06", "?", "\"Qalıq dərman vuruldu\"", "YENİ — WhatsApp-da yoxdur", "Yoxlanmalı", "Hansı dərmanın qalığı, hansı bloka — yazılmayıb."], ["11.06", "Fuji", "Kaptan, difenokonazol, mikroelement; qeyd: \"abamektin + etoksazol 14.06 vuruldu\"", "FƏRQ: WhatsApp-da abamektin + etoksazol 17.06", "Normal", "Miqdar yazılmayıb; gənə dərmanının tarixi 3 gün fərqlənir."], ["17.06", "Bütün bağ", "Kalsi-bor vuruldu", "FƏRQ: WhatsApp-da 21.06 Fuji", "Yaxşı", "Kalsium çiləmələri davam edir."], ["19.06", "Bütün bağ", "Gibberellin turşusu 500 q/1 t", "Eyni (WhatsApp 20.06)", "Yoxlanmalı", "Məqsədi yazılmayıb. Yayda gibberellin gələn ilin çiçək tumurcuqlarının əmələ gəlməsini azalda bilər. Hansı preparat (qatılıq) olduğunu yazın — reyestrdə GA3 (20 q/l) üçün 0,75 l/ha."], ["23.06", "Roza + Gala", "Malatyon 2 l, dimetoat 2 l, mikroelement 2 kq", "Eyni (WhatsApp 24.06)", "Səhv", "Eyni qrupdan iki dərman (IRAC 1B). Dimetoat 2 l — reyestrdə 0,8–1,2 l: ~1,7–2,5 dəfə çox; malatyon 2 l — reyestrdə 1,5 l/1 t."], ["23.06", "Fuji", "Kaptan 2 kq, difenokonazol 500 q, deltametrin 500 q, mikroelement 2 kq; pH 300 q", "Eyni (WhatsApp 24.06)", "Artıq", "Piretroid yenə — gənə və qanlı mənənə riskini artırır; deltametrin dozası yüksəkdir."], ["29.06", "Fuji", "Kaptan 2, difenokonazol 0,5 l, mikroelement 2 kq", "YENİ — WhatsApp-da yoxdur", "Normal", "Kontakt + DMI. Difenokonazol dozası yüksəkdir."], ["29.06", "Roza + Gala", "Kükürd 4 kq, dodin 1,5 l", "YENİ — WhatsApp-da yoxdur (Preparatlar səhifəsində dodin 2026-da 0 dəfə idi)", "Normal", "Yaxşı seçim — DMI-yə fasilə, yeni qrup (dodin). Dodin 1,5 l — reyestrdə 500 q/l preparat üçün 0,8–1 l: ~1,5–1,9 dəfə çox."], ["01.07", "Roza + Gala", "Kaptan 2 kq, difenokonazol 0,5, mikroelement 2 kq", "Eyni", "Normal", "Difenokonazol dozası yüksəkdir."], ["01.07", "Fuji", "Tiofanat-metil 1,5 kq, mikroelement, emamektin benzoat 0,5 kq", "FƏRQ: emamektin WhatsApp-da yoxdur", "Səhv", "Tiofanat-metil kontaktsız və ~2,5 dəfə yüksək dozada. Emamektin (meyvəyeyənə) — 5%-li preparat üçün reyestrdə 400 q/ha, 500 q normaya yaxındır."], ["02.07", "Bütün bağ", "Kalsi-bor 3 l", "Eyni", "Yaxşı", ""], ["07.07", "Bütün bağ", "Tiofanat-metil 1,5 kq, asetamiprid 1 kq", "Eyni (WhatsApp 06–09.07)", "Səhv", "Yenə kontaktsız tiofanat-metil. Asetamiprid 1 kq — 14.04-dəki 0,4 kq-dan 2,5 dəfə çox."], ["09.07", "Fuji", "Kalsi-bor", "Eyni", "Yaxşı", ""], ["14.07", "Fuji", "Malatyon 2 l, tiametoksam 0,5 kq, xlorpirifos-etil 1 l, mikroelement", "Eyni", "Səhv", "Xlorpirifos-etil QADAĞANDIR. Bir çəndə 3 insektisid. Tiametoksam 0,5 — reyestrdə 240 q/l preparat üçün 0,15 l/ha: ~3 dəfə çox."], ["16.07", "Bütün bağ", "Abamektin + etoksazol 1,5 l", "Eyni", "Yoxlanmalı", "Gənə sayı yazılmayıb. Preparatın adı yazılsın — qarışıq preparatda (104 + 52 q/l) reyestr norması 0,3 l/ha-dır."], ["18.07", "Bütün bağ", "Kaptan 3 kq, difenokonazol 0,5 l, mikroelement 2 kq", "Eyni", "Normal", "Difenokonazol dozası yüksəkdir."], ["22.07", "Bütün bağ", "Abamektin 1 l, etoksazol 0,5 l, spirodiklofen 0,300", "Eyni (WhatsApp 23.07)", "Artıq", "Bir çəndə 3 akarisid, 6 gün əvvəlki ilə eyni qruplar. İtaliya qaydası: ildə ən çox 2 akarisid çiləməsi. Abamektin 1 l — reyestrdə 18 q/l preparat üçün 0,25–0,7 l."], ["24.07", "Bütün bağ", "0-0-20 2 l, aminosit 2 l (1 t suya)", "Eyni", "Normal", "Rəng üçün kalium."], ["31.07", "Bütün bağ", "Kalsi-bor 4 l/1 t", "Eyni", "Yaxşı", ""], ["03.08", "Bütün bağ", "Abamektin 1 l, heksitiazoks 0,5 l, piridaben 1 kq, mikroelement 2 kq", "Eyni (WhatsApp 04.08)", "Artıq", "Maydan bəri 5-ci gənə çiləməsi, yenə 3 akarisid bir çəndə. Heksitiazoks və piridaben normaya yaxındır; abamektin yüksəkdir."], ["06.08", "Fuji", "Gibberellin turşusu 500 q/1 t", "Eyni", "Yoxlanmalı", "Məqsədi yazılmayıb (yuxarıya bax)."], ["12.08", "Bütün bağ", "Gibberellin turşusu", "Eyni (WhatsApp 11.08)", "Yoxlanmalı", "6 gün sonra təkrar, məqsəd yoxdur."], ["14.08", "Bütün bağ", "Kalsi-bor 1 t / 4 l", "Eyni", "Yaxşı", ""], ["16.08", "Bütün bağ", "Abamektin + etoksazol 1,5 l", "Eyni", "Artıq", "6-cı gənə çiləməsi. Sayım yazılmayıb."], ["17.08", "Bütün bağ", "Tiofanat-metil 1,5 kq, mikroelement 2 kq", "Eyni (WhatsApp 15–16.08)", "Səhv", "Kontaktsız tiofanat-metil, ~2,5 dəfə yüksək doza, yığıma yaxın."], ["2?.08", "Bütün bağ", "Malatyon 1,5 l, xlorpirifos-etil 1,5 l /1 t", "Eyni (WhatsApp 28.08)", "Səhv", "Xlorpirifos-etil QADAĞANDIR; yığıma yaxın; eyni qrupdan iki dərman."], ["01.09", "Bütün bağ", "Kalsi-bor 1 t / 4 l", "Eyni", "Yaxşı", ""], ["03.09", "Fuji + Roza", "Kaptan 3 kq, difenokonazol 500 q, mikroelement 2 kq, emamektin benzoat 500 q", "Eyni", "Yoxlanmalı", "Gözləmə müddəti yığım tarixi ilə yoxlanmalıdır (məs. kaptan preparatları üçün reyestrdə 14–21 gün)."]], "GOOD": ["Mövsümün başlanğıcı vaxtında: bordo yağışlardan əvvəl, sahəyə görə norma düz hesablanıb (5 kq × 8 ha = 40 kq).", "Yazda (aprel–may) əsasən kontakt dərmanlar (mankozeb, ditianon, kaptan, kükürd) yağışdan əvvəl vurulub — beynəlxalq təcrübədə ən təsirli strategiya budur.", "Mankozeb, siprodinil, penkonazol, ditianon, kaptan, kükürd, fenoksikarb, heksitiazoks, spirodiklofen normaları reyestrə (AQTA 2025) uyğundur.", "Meyvəyeyənə seçici dərmanlar (fenoksikarb, emamektin) işlədilib; un şehinə bupirimat qatılıb; dodin (yeni qrup) sınanıb.", "Kalsium-bor çiləmələri iyundan sentyabra qədər 2 həftədən bir — acı ləkəyə qarşı düzgün proqram.", "Dəftər WhatsApp-da olmayan qeydləri tamamlayır: 01.04 təzə qələmlər, 29.06 dodin + kükürd, 01.07 emamektin, 23.05 fungisid, 14.04 pirimetanilin dəqiq miqdarı."], "BAD": ["XLORPİRİFOS-ETİL 4 dəfə vurulub (08.06, 14.07, 2?.08, WhatsApp-da 24.09). Bu maddənin Azərbaycanda tətbiqi 01.01.2024-dən QADAĞANDIR (AQTA, 47 maddə siyahısı). Dərhal dayandırın, anbardakı qalığı qeyd edin.", "Sistemik dərmanların dozası reyestrdəkindən çoxdur: difenokonazol 0,5 l (reyestr 0,1–0,22 l, 2–5×), tiofanat-metil 1,5 kq (0,6 kq, ~2,5×), pirimetanil 1,2 l (0,5 l, ~2,4×), tebukonazol 0,6 kq (0,25 kq, ~2,4×), tiametoksam 0,5 (0,15, ~3×), deltametrin 0,5 l (0,1–0,35, 1,4–5×), dimetoat 2 l (0,8–1,2, ~2×). Artıq doza xəstəliyi daha yaxşı öldürmür, amma qalıq, xərc və rezistentlik artır.", "DMI qrupu (difenokonazol, penkonazol, tebukonazol) hər blokda mövsümdə təxminən 14–16 dəfə vurulub (məs. Fuji: 03.04-dən 03.09-a qədər ~14). İtaliyanın (Cənubi Tirol) qaydası ildə ən çox 7 (+1) çiləməyə icazə verir. Qara ləkə bu qrupa davamlı olarsa, yağışlı ildə \"xilasedici\" dərman qalmır.", "Tiofanat-metil 6 dəfə, çox vaxt kontakt partnyorsuz (rezistentlik riski ən yüksək qrup). Siprodinil/pirimetanil 8 gündə 3 dəfə ard-arda (18.04).", "Çiçəkləmədə insektisid: 14–15.04 asetamiprid, 25.04 lyambda-sihalotrin — arılar üçün təhlükəlidir.", "Gənəyə qarşı 6 çiləmə (may–avqust), çox vaxt 3 akarisid bir çəndə, sayım yazılmayıb. Türkiyə həddi: yarpaqda orta 8–10 gənə; İtaliya: ildə ≤ 2 akarisid. Piretroidlərin (lyambda, deltametrin) faydalı gənələri qırması gənə partlayışını gücləndirə bilər.", "Eyni qrupdan insektisidlər bir çəndə: malatyon + dimetoat + xlorpirifos (hamısı IRAC 1B) — birlikdə vurmağın faydası yoxdur.", "Gibberellin turşusu 3 dəfə (iyun–avqust) məqsədsiz yazılıb; tarixlər WhatsApp ilə 1–3 gün fərqlənir; bəzi qeydlərdə miqdar və blok yoxdur."], "ADVICE": ["Xlorpirifos-etili tamamilə çıxarın; qanlı mənənəyə qarşı başqa qrupdan qeydiyyatlı dərman seçin (\"Şərt → dərman\" səhifəsi, MN-1).", "Hər çiləmədə preparatın TİCARƏT ADINI və QATILIĞINI yazın — doza ancaq onunla yoxlanır. Norma etiketdən (reyestrdən) yuxarı olmasın.", "Sistemik dərmanı (DMI, tiofanat, siprodinil, QoI) həmişə kontakt dərmanla (kaptan, ditianon, mankozeb) qarışdırın və mövsümdə qrup sayını sayın.", "Gənə dərmanını yalnız sayımdan sonra vurun (100 yarpaq, 8–10 gənə/yarpaq), ildə 2 dəfədən çox yox, hər dəfə başqa qrup.", "Çiçəkləmədə insektisid vurmayın.", "Tarix, blok, faza, su (t/ha) və hava şəraitini bir yerdə (bu saytda) yazın — WhatsApp və dəftər arasında fərq olmasın."]};
var GC = { 'Yaxşı': ['#E3F1E7', '#17603A'], 'Normal': ['#EEF0EF', '#444C52'], 'Artıq': ['#FFF1D6', '#7A5300'], 'Səhv': ['#FBE3E0', '#9F1C14'], 'Yoxlanmalı': ['#E4ECF6', '#284A73'] };
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function initDefter() {
  var rows = document.getElementById('df-rows'); if (!rows || rows.dataset.ok) return; rows.dataset.ok = '1';
  var box = function (t, bg, bd, items) { return '<section style="flex:1 1 340px;min-width:0;background:' + bg + ';border:1px solid ' + bd + ';border-radius:14px;padding:16px 18px"><h2 style="margin:0 0 8px;font-size:18px">' + t + '</h2><ul style="margin:0;padding-left:18px;line-height:1.55;font-size:14px">' + items.map(function (x) { return '<li style="margin-bottom:6px">' + esc(x) + '</li>'; }).join('') + '</ul></section>'; };
  var cnt = {}; DF.E.forEach(function (e) { cnt[e[4]] = (cnt[e[4]] || 0) + 1; });
  document.getElementById('df-sum').innerHTML = box('✔ Düz edilənlər', '#F2F8F4', '#CFE3D6', DF.GOOD) + box('✘ Səhvlər', '#FDF3F2', '#F0CFCB', DF.BAD) + box('➜ Nə etməli', '#F4F6FA', '#D3DCE8', DF.ADVICE);
  var cur = 'Hamısı', btns = document.getElementById('df-btns');
  function draw() {
    rows.innerHTML = DF.E.filter(function (e) { return cur === 'Hamısı' || e[4] === cur; }).map(function (e) {
      var g = GC[e[4]] || ['#eee', '#333'], diff = /^(FƏRQ|YENİ|DƏQİQ)/.test(e[3]);
      return '<tr style="border-bottom:1px solid #ECEFEC;vertical-align:top"><td style="padding:8px;white-space:nowrap">' + esc(e[0]) + '</td><td style="padding:8px">' + esc(e[1]) + '</td><td style="padding:8px">' + esc(e[2]) +
        '</td><td style="padding:8px;' + (diff ? 'color:#7A5300;font-weight:600' : 'color:#5A665E') + '">' + esc(e[3]) + '</td><td style="padding:8px"><span style="display:inline-block;padding:3px 9px;border-radius:99px;background:' + g[0] + ';color:' + g[1] + ';font-weight:700;white-space:nowrap">' + esc(e[4]) +
        '</span></td><td style="padding:8px;line-height:1.5">' + esc(e[5] || '—') + '</td></tr>';
    }).join('');
  }
  ['Hamısı', 'Səhv', 'Artıq', 'Yoxlanmalı', 'Normal', 'Yaxşı'].forEach(function (k) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = k + ' · ' + (k === 'Hamısı' ? DF.E.length : (cnt[k] || 0));
    b.style.cssText = 'min-height:44px;padding:0 14px;border-radius:99px;border:1px solid #CDD4CE;background:' + (k === 'Hamısı' ? '#E7EFE9' : '#fff') + ';color:#16201A;font-size:14px;cursor:pointer';
    b.setAttribute('aria-pressed', k === 'Hamısı' ? 'true' : 'false');
    b.onclick = function () { cur = k; Array.prototype.forEach.call(btns.children, function (c) { c.style.background = '#fff'; c.setAttribute('aria-pressed', 'false'); }); b.style.background = '#E7EFE9'; b.setAttribute('aria-pressed', 'true'); draw(); };
    btns.appendChild(b);
  });
  draw();
}

</script>
