class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (m && /^(checked|disabled|selected)$/i.test(a.name)) { var bv = !!get(m[1], scopes); el.removeAttribute(a.name); if (bv) el.setAttribute(a.name, ''); return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    var mount = function () { comp = new Component({}); window.__dcRender(); };
    // Server rejimi: api/state varsa, bütün ekranlar eyni (paylaşılan) məlumatla işləyir; yoxdursa (GitHub) — nümunə rejimi
    var done = false, go = function (s) { if (done) return; done = true; window.ORCHARD = (s && s.server) ? s : undefined; mount(); };
    setTimeout(function () { go(null); }, 2500);
    fetch('api/state', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(go);
  });
})();

var HAVA = [40.8114, 48.0714];
function fmt(n) { return String(n).replace('.', ','); }
function initBagMap() {
  var el = document.getElementById('bag-map');
  if (!el || el.dataset.ok) return;
  if (!window.L) { setTimeout(initBagMap, 200); return; }
  el.dataset.ok = '1';
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Peyk: Esri, Maxar, Earthstar Geographics' });
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  var map = L.map(el, { layers: [sat], scrollWheelZoom: true });
  L.control.layers({ 'Peyk': sat, 'Xəritə': osm }, null, { position: 'topright' }).addTo(map);
  L.control.scale({ imperial: false }).addTo(map);
  var all = [], polys = {};
  BLK.forEach(function (b) {
    var p = L.polygon(b.coords, { color: '#FFFFFF', weight: 2, fillColor: b.color, fillOpacity: 0.35 }).addTo(map);
    p.bindTooltip(b.name + ' · ' + fmt(b.area) + ' ha', { permanent: true, direction: 'center', className: 'blk' });
    p.on('click', function () { pick(b.id, true); });
    polys[b.id] = p; all = all.concat(b.coords);
  });
  L.circleMarker(HAVA, { radius: 7, color: '#1F5E3B', weight: 3, fillColor: '#FFFFFF', fillOpacity: 1 }).addTo(map)
    .bindTooltip('Hava nöqtəsi (Open-Meteo) · 520 m', { direction: 'top' });
  map.fitBounds(L.latLngBounds(all), { padding: [24, 24] });
  var btns = document.getElementById('blk-btns');
  BLK.forEach(function (b) {
    var x = document.createElement('button'); x.type = 'button'; x.id = 'btn-' + b.id;
    x.textContent = b.name + ' · ' + fmt(b.area) + ' ha';
    x.style.cssText = 'min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #CDD4CE;background:#fff;color:#16201A;font-size:14px;cursor:pointer;border-left:6px solid ' + b.color;
    x.onclick = function () { pick(b.id, true); }; btns.appendChild(x);
  });
  function phaseText() {
    try { if (window.ORCHARD && window.ORCHARD.phase) return window.ORCHARD.phase.code; var v = JSON.parse(localStorage.getItem('orchard_phase')); if (v && v.code) return v.code; } catch (e) {}
    return 'Fenologiya səhifəsində təsdiqlənməyib';
  }
  function pick(id, fly) {
    var b = BLK.filter(function (x) { return x.id === id; })[0];
    BLK.forEach(function (x) { polys[x.id].setStyle({ weight: x.id === id ? 4 : 2, fillOpacity: x.id === id ? 0.5 : 0.3, color: x.id === id ? '#F4C542' : '#FFFFFF' });
      var bt = document.getElementById('btn-' + x.id); bt.style.background = x.id === id ? '#E7EFE9' : '#fff'; bt.setAttribute('aria-pressed', x.id === id); });
    if (fly) map.fitBounds(polys[id].getBounds(), { padding: [40, 40], maxZoom: 18 });

    var gr = { 'Yaxşı': '#17603A', 'Normal': '#444C52', 'Artıq': '#7A5300', 'Səhv': '#9F1C14', 'Yoxlanmalı': '#284A73' };
    var rows = [['Sahə (koordinatdan)', fmt(b.area) + ' ha'], ['Perimetr', b.per + ' m'], ['Mərkəz', b.c[0].toFixed(5) + ', ' + b.c[1].toFixed(5)],
      ['Əkin', '2017 — 20 sm-lik təzə calaqlı çubuq; 2018–2019 fidan'], ['Hesab üçün yaş', '6–7 il'],
      ['Sıra aralığı', fmt(b.sp) + ' m (peyk, 2019)'], ['Sıra istiqaməti', '≈' + b.brg + '° (şimal-şərq — cənub-qərb)'], ['Sıra uzunluğu', '≈' + b.rl + ' m'],
      ['Sıraların düzlüyü', 'düz — ən çox ' + fmt(b.dev) + ' m kənara çıxma (şəklin dəqiqliyi ~0,5 m)'], ['KML adı', b.kml], ['Cari faza (bağ üzrə)', phaseText()], ['Hava', 'Open-Meteo · TƏXMİNİ'], ['2026 çiləmələri', b.n26 + ' qeyd (bütün bağa yazılanlar daxil)']];
    var h = '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 12px">' +

      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><a href="Dermanlama.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;background:#1F5E3B;color:#fff;font-weight:600;text-decoration:none">Bütün jurnal</a>' +
