<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (m && /^(checked|disabled|selected)$/i.test(a.name)) { var bv = !!get(m[1], scopes); el.removeAttribute(a.name); if (bv) el.setAttribute(a.name, ''); return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    comp = new Component({}); window.__dcRender();
  });
})();


class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.draft = '';
    this.state = { msgs: ['risk'] };
  }
  renderVals() {
    var self = this;
    var A = {
      risk: { q: 'Fuji blokunda qara ləkə riski varmı?', parts: [
        ['Vəziyyət.', '03.04 21:40-dan yarpaqlar təxminən 12 s 40 dəq islaq qalıb, orta temperatur 12,4 °C.'],
        ['Problem.', 'Mills cədvəlinə görə bu temperaturda infeksiya üçün 11 saat kifayətdir — şərtlər ödənib.'],
        ['Məlumat və keyfiyyəti.', 'TƏXMİNİ: sensor yoxdur, hava Open-Meteo-dan, islanma rütubət və yağışdan təxmin edilib. Ona görə nəticə KRİTİK sayılmır.'],
        ['Elmi əsas.', 'Mills cədvəli, kitab Fəsil 45.3, səh. 362 (ilkin mənbə: Agriculture Victoria).'],
        ['Tövsiyə.', 'Qorunma vəziyyətini qiymətləndirin: son çiləmə 31.03, ondan sonra təxminən 18 mm yağış. Qərarı aqronom preparatın etiketinə görə verir.'],
        ['Qeyri-müəyyənlik.', 'Bağda yağış və islanma ölçülmür; model bağınızda yoxlanmayıb. 14–16 gün sonra yarpaqlara baxıb nəticəni qeyd edin.']],
        src: ['[KİTAB] Fəsil 45.3, səh. 362', '[MODEL] SCAB_MILLS_VIC v1.0', 'Open-Meteo · 10:00', 'Jurnal: çiləmə 31.03'] },
      today: { q: 'Bu gün bağda nə etməliyəm?', parts: [
        ['1. Yüksək:', 'qara ləkə şərtləri ödənib — qorunma vəziyyətini qiymətləndirin (bütün bağ).'],
        ['2. Orta:', 'D3 çiləməsi (Ditianon 500 q + Siprodinil 400 q /ha) — sabahkı yağışdan əvvəl bitirin. Aqronom təsdiqləyib, işçinin siyahısındadır.'],
        ['3. Orta:', 'qırmızı gənə sayımı (Gala) — 1 gün gecikib.'],
        ['4. Aşağı:', 'fazanı şəkillə təsdiqləyin — sistem D3 təxmin edir.']],
        src: ['Tapşırıqlar', 'Düzəldilmiş plan', 'Open-Meteo proqnozu'] },
      rain: { q: 'Son yağış Mills hesablamasına necə təsir etdi?', parts: [
        ['Yağış', '03.04 21:40-da başladı və islanma epizodu o andan sayıldı (kitab: islanma yağışın başlanğıcından sayılır).'],
        ['Fasilə.', 'Arada 6 saatlıq quruluq olmadığı üçün epizod kəsilmədi (UC IPM qaydası).'],
        ['Nəticə.', '04.04 08:40-da 11 saat dolub — şərtlər ödənib. Ləkələr təxminən 18–20.04-də görünə bilər (cədvəl: 14–16 gün).'],
        ['Qeyd.', 'Rəqəmlər TƏXMİNİ-dir: bağda yağış ölçülmür.']],
        src: ['[KİTAB] Fəsil 45.3', '[ELMİ] S362 UC IPM', 'Open-Meteo'] },
      next: { q: 'Növbəti çiləmə nə vaxtdır?', parts: [
        ['İndi:', 'D3 fazası — Ditianon 500 q + Siprodinil 400 q /ha (düzəldilmiş plan). Əvəzi: Siprodinil yerinə Pirimetanil.'],
        ['Sonra:', 'E–E2 fazası, təxminən 10.04 — Mankozeb 2 kq + Dodin + Bor 1 kq + Aminogal 1 l /ha.'],
        ['Xatırlatma:', 'F fazasında (çiçək) insektisid vurulmur. Dozalar etiketlə yoxlanmalıdır.']],
        src: ['Düzəldilmiş plan (2027_dermanlama_gubreleme_plani.xlsx)', 'Fenologiya: D3 (təxmini)'] },
      last: { q: 'Son dərmanlamadan neçə gün keçib?', parts: [
        ['4 gün.', 'Son çiləmə 31.03, D fazası: Mankozeb 2 kq + Penkonazol 400 q + Bor və Sink 500 q /ha, bütün bağ. İşçi bitirib: 8 t su, 2 foto.'],
        ['Ondan sonra', 'təxminən 18 mm yağış yağıb (Open-Meteo, təxmini).']],
        src: ['Tapşırıqlar: 31.03', 'Open-Meteo'] }
    };
    var msgs = this.state.msgs.map(function (k) {
      if (typeof k === 'object') return { q: k.q, parts: [{ b: 'DEMO:', t: 'Bu nümunə saytda AI qoşulmayıb, ona görə öz sualınıza cavab verə bilmirəm. Real sistemdə (Mərhələ 5) AI bağın məlumatlarına və kitaba baxıb cavab verəcək. Hələlik yuxarıdakı hazır suallardan birini seçin.' }], hasSrc: false, src: [] };
      var a = A[k];
      return { q: a.q, parts: a.parts.map(function (p) { return { b: p[0], t: p[1] }; }), hasSrc: true, src: a.src.map(function (s) { return { t: s }; }) };
    });
    var add = function (k) { self.setState({ msgs: self.state.msgs.concat([k]) }); };
    var chips = ['today', 'risk', 'rain', 'next', 'last'].map(function (k) { return { q: A[k].q, ask: function () { add(k); } }; });
    var send = function () {
      var q = (self.draft || '').trim();
      if (!q) return;
      self.draft = '';
      var box = document.getElementById('q'); if (box) box.value = '';
      add({ q: q });
    };
    return { msgs: msgs, chips: chips, send: send,
      onInput: function (e) { self.draft = e.target.value; },
      onKey: function (e) { if (e.key === 'Enter') { self.draft = e.target.value; send(); } } };
  }
}

</script>
