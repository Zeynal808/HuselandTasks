          <div><b>Mənbə:</b> Sentelhas və həmk. (2008), Agricultural and Forest Meteorology, DOI 10.1016/j.agrformet.2007.09.011 — nisbi rütubətin yarpaq islanmasının təxmini kimi yararlılığı. Kitab, Fəsil 45.3: islanma yağışın başlanğıcından sayılır; askosporlar ≥ 0,25 mm yağışla buraxılır.</div>
          <div style="color: #7A5300"><b>Diqqət:</b> məqalənin tam mətni oxunmayıb — 90% həddi təsdiqdən əvvəl tam mətnlə yoxlanmalıdır. Nəticə həmişə TƏXMİNİ-dir və KRİTİK səviyyəyə çatmır. Bu qayda təsdiqlənməyincə qara ləkə hesabı "məlumat kifayət deyil" göstərir.</div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><button type="button" onClick="{{approveWet}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #1F5E3B; background: #1F5E3B; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">{{wetLabel}}</button><span style="font-size: 13px; color: #5A665E">{{liveNote}}</span></div>

<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (m && /^(checked|disabled|selected)$/i.test(a.name)) { var bv = !!get(m[1], scopes); el.removeAttribute(a.name); if (bv) el.setAttribute(a.name, ''); return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    var mount = function () { comp = new Component({}); window.__dcRender(); };
    // Server rejimi: api/state varsa, bütün ekranlar eyni (paylaşılan) məlumatla işləyir; yoxdursa (GitHub) — nümunə rejimi
    var done = false, go = function (s) { if (done) return; done = true; window.ORCHARD = (s && s.server) ? s : undefined; mount(); };
    setTimeout(function () { go(null); }, 2500);
    fetch('api/state', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(go);
  });
})();


(function(){
  function toggle(open){ document.body.classList.toggle('mnav-open', open); var b=document.getElementById('mnav-btn'); if(b) b.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('#mnav-btn')) { toggle(!document.body.classList.contains('mnav-open')); return; }
    if (e.target.id === 'mnav-shade') { toggle(false); return; }
    if (document.body.classList.contains('mnav-open') && e.target.closest && e.target.closest('nav[aria-label="Əsas menyu"] a')) toggle(false);
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') toggle(false); });
})();


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ok: {} }; }
  renderVals() {
    var self = this, st = this.state;
    var data = [['34', '1,1', '41', '48'], ['36', '2,2', '35', '48'], ['37', '2,8', '30', '41'], ['39', '3,9', '28', '33'], ['41', '5,0', '21', '26'], ['43', '6,1', '18', '21'],
      ['45', '7,2', '15', '17'], ['46', '7,8', '13', '16'], ['48', '8,9', '12', '15'], ['50', '10,0', '11', '14'], ['52', '11,1', '9', '12'], ['54', '12,2', '8', '11,5'],
      ['55', '12,8', '8', '11'], ['57', '13,9', '7', '10'], ['59', '15,0', '7', '10'], ['61–75', '16,1–23,9', '6', '9'], ['77', '25,0', '8', '11']];
    var n = 0;
    var rows = data.map(function (d, i) {
      var ok = !!st.ok[i]; if (ok) n++;
      return { f: d[0], t: d[1], h: d[2], d: d[3], ok: ok, mark: ok ? '✓' : '', bg: ok ? '#F3F8F4' : '#FFFFFF',
        btnBg: ok ? '#1F5E3B' : '#FFFFFF', btnFg: '#FFFFFF', btnBorder: ok ? '#1F5E3B' : '#CDD4CE',
        toggle: function () { var o = Object.assign({}, st.ok); o[i] = !o[i]; self.setState({ ok: o }); } };
    });
    var all = n === data.length;
    var live = !!(window.ORCHARD && window.ORCHARD.server), R = live ? window.ORCHARD.rules : {};
    var mAct = live ? R.SCAB_MG_STENSVAND.status === 'AKTİV' : !!st.demoMills, wAct = live ? R.WET_RH_EST.status === 'AKTİV' : !!st.demoWet;
    var post = function (code) { fetch('api/rules/' + code + '/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ by: 'Sahib' }) }).then(function (r) { return r.json(); }).then(function (s) { window.ORCHARD = s; if (window.__dcRender) window.__dcRender(); }); };
    return { millsChip: mAct ? 'AKTİV' : 'QARALAMA', millsBg: mAct ? '#E3F1E8' : '#FDF3D7', millsFg: mAct ? '#17603A' : '#7A5300',
      wetChip: wAct ? 'AKTİV' : 'QARALAMA', wetBg: wAct ? '#E3F1E8' : '#FDF3D7', wetFg: wAct ? '#17603A' : '#7A5300',
      approveLabel: mAct ? 'Təsdiqlənib ✓' : 'Təsdiqlə → AKTİV', wetLabel: wAct ? 'Təsdiqlənib ✓' : 'Təsdiqlə → AKTİV',
      liveNote: live ? 'Təsdiq serverdə audit jurnalına yazılır.' : 'Nümunə rejimi: təsdiq yalnız bu ekranda görünür.',
      approve: function () { if (!all || mAct) return; if (live) post('SCAB_MG_STENSVAND'); else self.setState({ demoMills: true }); },
      approveWet: function () { if (wAct) return; if (live) post('WET_RH_EST'); else self.setState({ demoWet: true }); },
      rows: rows, checked: n, total: data.length,
      approveBg: all ? '#1F5E3B' : '#ECEEEF', approveFg: all ? '#FFFFFF' : '#5F676D', approveBorder: all ? '#1F5E3B' : '#CDD4CE' };
  }
}

</script>
