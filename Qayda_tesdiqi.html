<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Qaydanın təsdiqi — ORCHARD AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F2}
a{color:#1F5E3B}a:hover{color:#123D26}
button{font-family:inherit}
</style>

</head>
<body>
<div style="position:sticky;top:0;z-index:10;background:#123D26;color:#fff;font:600 13px Inter,system-ui,sans-serif;padding:8px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><a href="index.html" style="color:#fff">← Bütün ekranlar</a><span style="opacity:.85">ORCHARD AI — dizayn nümunəsi (DEMO, real məlumat deyil)</span></div>
<template id="dc-template">

<div style="font-family: Inter, system-ui, sans-serif; color: #16201A; background: #F4F5F2; min-height: 100vh; font-feature-settings: 'tnum' 1">
  <div style="display: flex; flex-wrap: wrap; align-items: stretch">
    <nav aria-label="Əsas menyu" style="flex: 1 1 220px; max-width: 260px; min-width: 200px; background: #FFFFFF; border-right: 1px solid #E2E6E2; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5E3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7c-3.5-2-8 0-8 5s3 9 6 9c1 0 1.5-.5 2-.5s1 .5 2 .5c3 0 6-4 6-9s-4.5-7-8-5z"></path><path d="M12 7c0-2 1-4 3-5"></path></svg>
        <div style="font-weight: 700; font-size: 17px">ORCHARD AI</div>
      </div>
      <a href="Main.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Ana səhifə</a>
      <a href="Xerite.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Xəritə və bloklar</a>
      <a href="Qara_leke.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Risklər</a>
      <a href="Dermanlama.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Dərmanlama və gübrə</a>
      <a href="Isci_mobil.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Tapşırıqlar</a>
      <a href="Sensorlar.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Sensorlar</a>
      <a href="Qayda_tesdiqi.html" style="padding: 10px 12px; border-radius: 8px; background: #E7EFE9; color: #123D26; font-weight: 600; text-decoration: none; font-size: 15px">Qaydalar və kitab</a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; padding: 24px; box-sizing: border-box">
      <div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
        <header style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 8px; border-radius: 6px; background: #FDF3D7; color: #7A5300">QARALAMA</span>
            <span style="font-size: 13px; color: #5A665E">SCAB_MILLS_VIC · versiya 1.0 · çıxarıldı 11.11.2026</span>
          </div>
          <h1 style="margin: 0; font-size: 26px; letter-spacing: -0.02em">Mills cədvəli — kitab ilə müqayisə</h1>
          <div style="font-size: 14px; color: #33403A">Hər sətri soldakı orijinal səhifə ilə yoxlayın. Təsdiqdən sonra qayda AKTİV olur və mühərrik ondan istifadə edir.</div>
        </header>

        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
          <section aria-label="Kitabın orijinal səhifəsi" style="flex: 1 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E6E2; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #33403A">
              <span><b>[KİTAB]</b> Fəsil 45.3 · Cədvəl 45.1 · səh. 362</span>
              <div style="display: flex; gap: 6px">
                <button type="button" aria-label="Əvvəlki səhifə" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #CDD4CE; background: #FFFFFF; color: #16201A">‹</button>
                <button type="button" aria-label="Növbəti səhifə" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #CDD4CE; background: #FFFFFF; color: #16201A">›</button>
              </div>
            </div>
            <img src="kitab_sehife_362.png" alt="Kitabın 362-ci səhifəsi: Mills cədvəli 45.1 və qrafik" style="width: 100%; height: auto; border-radius: 6px; border: 1px solid #ECEFEC">
          </section>

          <section aria-labelledby="ext-h" style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
            <div style="background: #FFFFFF; border: 1px solid #E2E6E2; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline">
                <h2 id="ext-h" style="margin: 0; font-size: 18px">Çıxarılmış cədvəl</h2>
                <span style="font-size: 13px; color: #5A665E">{{checked}} / 10 sətir yoxlanıb</span>
              </div>
              <div style="overflow-x: auto">
                <table style="width: 100%; min-width: 380px; border-collapse: collapse; font-size: 14px">
                  <thead><tr style="text-align: left; font-size: 12px; color: #5A665E">
                    <th style="padding: 8px; border-bottom: 1px solid #E2E6E2; font-weight: 600">ORTA T, °C</th>
                    <th style="padding: 8px; border-bottom: 1px solid #E2E6E2; font-weight: 600">İSLANMA, SAAT</th>
                    <th style="padding: 8px; border-bottom: 1px solid #E2E6E2; font-weight: 600">LƏKƏ, GÜN</th>
                    <th style="padding: 8px; border-bottom: 1px solid #E2E6E2; font-weight: 600">YOXLANDI</th>
                  </tr></thead>
                  <tbody>
                    <template data-for="rows" data-as="r">
                      <tr style="background: {{r.bg}}">
                        <td style="padding: 8px; border-bottom: 1px solid #ECEFEC">{{r.t}}</td>
                        <td style="padding: 8px; border-bottom: 1px solid #ECEFEC; font-weight: 600">{{r.h}}</td>
                        <td style="padding: 8px; border-bottom: 1px solid #ECEFEC">{{r.d}}</td>
                        <td style="padding: 4px 8px; border-bottom: 1px solid #ECEFEC">
                          <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.ok}}" aria-label="Sətri yoxlanmış kimi işarələ" style="width: 44px; height: 36px; border-radius: 8px; border: 1px solid {{r.btnBorder}}; background: {{r.btnBg}}; color: {{r.btnFg}}; font-size: 16px; font-weight: 700; cursor: pointer">{{r.mark}}</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <div style="background: #FFFFFF; border: 1px solid #E2E6E2; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5">
              <h2 style="margin: 0; font-size: 16px">Qaydanın məlumatları</h2>
              <div><span style="color: #5A665E">Versiya:</span> orijinal Mills (1944), "yüngül infeksiya" sütunu, °C — <b>ehtimal</b></div>
              <div><span style="color: #5A665E">İlkin mənbə:</span> [ELMİ] S361 Agriculture Victoria</div>
              <div><span style="color: #5A665E">Temperatur:</span> islanma dövründə saatlıq ölçmələrin ortası</div>
              <div><span style="color: #5A665E">Diapazondan kənar:</span> &lt; 5,5 °C və &gt; 25 °C → məlumat kifayət deyil</div>
              <div style="color: #7A5300"><b>Kitabda yoxdur:</b> orta və ağır infeksiya sütunları</div>
              <label for="note" style="font-weight: 600; margin-top: 4px">Aqronomun qeydi</label>
              <textarea id="note" rows="3" placeholder="Məsələn: səh. 362 ilə tutuşduruldu, fərq yoxdur" style="font: inherit; padding: 10px; border: 1px solid #CDD4CE; border-radius: 8px; resize: vertical"></textarea>
              <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px">
                <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid {{approveBorder}}; background: {{approveBg}}; color: {{approveFg}}; font-size: 14px; font-weight: 600">Təsdiqlə → AKTİV</button>
                <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #CDD4CE; background: #FFFFFF; color: #16201A; font-size: 14px">Rədd et</button>
              </div>
              <div style="font-size: 12px; color: #5A665E">Təsdiq düyməsi bütün 10 sətir yoxlananda aktivləşir. Kim və nə vaxt təsdiqlədiyi audit jurnalına yazılır.</div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    comp = new Component({}); window.__dcRender();
  });
})();


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ok: { 0: true, 1: true, 2: true } }; }
  renderVals() {
    var self = this, st = this.state;
    var data = [['5,5', '30', '—'], ['7', '20', '17-dən çox'], ['10', '14', '16'], ['13', '11', '14'], ['14–15', '10', '12'],
      ['15,5', '9,5', '11'], ['16–16,5', '9', '10'], ['17–24', '9', '9'], ['24,5', '9,5', '—'], ['25', '11', '—']];
    var n = 0;
    var rows = data.map(function (d, i) {
      var ok = !!st.ok[i]; if (ok) n++;
      return { t: d[0], h: d[1], d: d[2], ok: ok, mark: ok ? '✓' : '', bg: ok ? '#F3F8F4' : '#FFFFFF',
        btnBg: ok ? '#1F5E3B' : '#FFFFFF', btnFg: '#FFFFFF', btnBorder: ok ? '#1F5E3B' : '#CDD4CE',
        toggle: function () { var o = Object.assign({}, st.ok); o[i] = !o[i]; self.setState({ ok: o }); } };
    });
    var all = n === data.length;
    return { rows: rows, checked: n,
      approveBg: all ? '#1F5E3B' : '#ECEEEF', approveFg: all ? '#FFFFFF' : '#5F676D', approveBorder: all ? '#1F5E3B' : '#CDD4CE' };
  }
}

</script>
</body>
</html>
