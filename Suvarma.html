<div id="dc-root"></div>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (m && /^(checked|disabled|selected)$/i.test(a.name)) { var bv = !!get(m[1], scopes); el.removeAttribute(a.name); if (bv) el.setAttribute(a.name, ''); return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    comp = new Component({}); window.__dcRender();
  });
})();


class Component extends DCLogic {
  renderVals() {
    var T0 = new Date(), DAY = 864e5; function dd(o) { var d = new Date(T0.getTime() + o * DAY); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
    var et = [0.9, 0.8, 1.0, 0.7, 0.6, 0.8, 0.7], rn = [0, 4.0, 6.0, 0, 2.0, 0, 0], lb = [-6, -5, -4, -3, -2, -1, 0].map(dd);
    var days = lb.map(function (l, i) { return { label: l, etH: Math.round(et[i] * 20) + 'px', rH: Math.round(rn[i] * 10) + 'px' }; });
    var blocks = ['Fuji — Blok 1', 'Gala — Blok 2', 'Granny Smith — Blok 3', 'Story — Blok 4'].map(function (n) { return { n: n }; });
    return { days: days, blocks: blocks };
  }
}
