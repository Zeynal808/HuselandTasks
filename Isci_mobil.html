<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>İşçi — bugünkü işlər</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5E3B}a:hover{color:#123D26}
button,input{font-family:inherit}
</style>

<style>body{background:#DDE2DD}#dc-root{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}#dc-root>div{box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:24px}</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:10;background:#123D26;color:#fff;font:600 13px Inter,system-ui,sans-serif;padding:8px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><a href="index.html" style="color:#fff">← Bütün ekranlar</a><span style="opacity:.85">ORCHARD AI — dizayn nümunəsi (DEMO, real məlumat deyil)</span></div>
<template id="dc-template">

<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #16201A; background: #F4F5F2; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #16201A; color: #F4F5F2; padding: 6px 16px; font-size: 12px; display: flex; gap: 8px; align-items: center">
    <span style="background: #F4C542; color: #16201A; font-weight: 700; padding: 1px 6px; border-radius: 4px">DEMO</span><span>Nümunə tapşırıqlar</span>
  </div>
  <header style="padding: 16px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border-bottom: 1px solid #E2E6E2">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 13px; color: #5A665E">Salam, [işçinin adı]</div>
      <span style="font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 99px; background: {{netBg}}; color: {{netFg}}">{{netLabel}}</span>
    </div>
    <h1 style="margin: 0; font-size: 24px; letter-spacing: -0.02em">Bugünkü işlərim</h1>
    <div style="font-size: 14px; color: #33403A">{{doneN}} / {{total}} tamamlandı · {{today}} · faza {{phaseCode}}</div>
  </header>
  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <template data-for="tasks" data-as="t">
      <div style="background: #FFFFFF; border: 1px solid #E2E6E2; border-left-width: 1px; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; opacity: {{t.opacity}}">
        <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap">
          <span style="font-size: 13px; color: #5A665E">{{t.kindLabel}} · {{t.block}}</span>
          <span style="font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: {{t.chipBg}}; color: {{t.chipFg}}">{{t.prio}}</span>
        </div>
        <template data-if="t.hasTag">
          <span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 6px; background: #1F5E3B; color: #FFFFFF">{{t.tag}}</span>
        </template>
        <div style="font-size: 18px; font-weight: 600; line-height: 1.3; text-decoration: {{t.strike}}">{{t.title}}</div>
        <div style="font-size: 14px; color: #33403A; line-height: 1.45">{{t.note}}</div>
        <template data-if="t.hasWhy"><div style="font-size: 14px; color: #33403A; line-height: 1.45; background: #E7EFE9; border-radius: 10px; padding: 8px 10px"><b>Niyə:</b> {{t.why}}</div></template>
        <template data-if="t.hasMix">
          <div style="background: #F4F5F2; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
            <template data-for="t.mix" data-as="m">
              <div style="display: flex; justify-content: space-between; gap: 8px"><span>{{m.name}}</span><b style="font-weight: 600; white-space: nowrap">{{m.dose}}</b></div>
            </template>
            <div style="font-size: 12px; color: #5A665E; border-top: 1px solid #E2E6E2; padding-top: 6px">{{t.mixNote}}</div>
          </div>
        </template>
        <template data-if="t.hasSafety">
          <div style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #7A5300; background: #FDF3D7; border-radius: 10px; padding: 8px 10px; line-height: 1.4">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
            <span>{{t.safety}}</span>
          </div>
        </template>
        <template data-if="t.showForm">
          <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #ECEFEC; padding-top: 10px">
            <div style="font-size: 13px; font-weight: 600">Faktiki nə vuruldu?</div>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #33403A">Sərf olunan su, ton
              <input type="text" inputmode="decimal" placeholder="məs. 8" style="min-height: 44px; padding: 0 12px; border: 1px solid #CDD4CE; border-radius: 8px; font-size: 16px"></label>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #33403A">Qeyd (fərq varsa)
              <input type="text" placeholder="məs. siprodinil qurtardı, pirimetanil qoyuldu" style="min-height: 44px; padding: 0 12px; border: 1px solid #CDD4CE; border-radius: 8px; font-size: 15px"></label>
          </div>
        </template>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="min-height: 56px; border-radius: 10px; border: 1px solid #CDD4CE; background: #FFFFFF; color: #16201A; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Foto</button>
          <button type="button" onClick="{{t.toggle}}" style="min-height: 56px; border-radius: 10px; border: 1px solid #1F5E3B; background: {{t.btnBg}}; color: {{t.btnFg}}; font-size: 16px; font-weight: 700">{{t.btnLabel}}</button>
        </div>
      </div>
    </template>
    <button type="button" style="min-height: 56px; border-radius: 12px; border: 1px dashed #1F5E3B; background: transparent; color: #1F5E3B; font-size: 16px; font-weight: 600">+ Müşahidə yaz (xəstəlik, zərərverici)</button>
    <button type="button" onClick="{{toggleNet}}" style="min-height: 44px; border: 0; background: transparent; color: #5A665E; font-size: 13px; text-decoration: underline">İnterneti söndür / yandır (sınaq)</button>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (m && /^(checked|disabled|selected)$/i.test(a.name)) { var bv = !!get(m[1], scopes); el.removeAttribute(a.name); if (bv) el.setAttribute(a.name, ''); return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    comp = new Component({}); window.__dcRender();
  });
})();


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: {}, offline: false }; }
  renderVals() {
    var self = this, st = this.state, n = 0, pending = 0;
    var PHASES = [['B', 'Tumurcuq şişir'], ['C', 'Yaşıl uc görünür'], ['C3', 'Yaşıl uc açılır'], ['D', 'Yaşıl salxım'], ['D3', 'Salxımda tumurcuqlar ayrılır'],
      ['E', 'Kasa yarpaqları görünür'], ['E2', 'Çəhrayı tumurcuq'], ['F', 'İlk çiçəklər'], ['F2', 'Tam çiçəkləmə'], ['G', 'Ləçəklər tökülür'], ['H', 'Meyvə bağlayır'],
      ['I', 'Meyvə böyüyür (I)'], ['J', 'Meyvə böyüyür (J)'], ['Payız-1', 'Yarpaqlar saralır'], ['Payız-2', 'Yarpaqların ~95%-i töküldü']];
    var SANW = 'Qara ləkə göbələyi tökülmüş yarpaqlarda qışlayır və yazda askospor buraxır. Yarpaqların xırdalanması riski 80–90%, karbamid askosporları 50–66% azaldıb (kitab, Fəsil 45).';
    var BORDO = { k: 'spray', title: 'Çiləmə: Bordo 50% 5 kq/ha', what: 'Bordo 50% 5 kq/ha, yağışdan əvvəl', alt: 'Mis 50% 5 kq/ha və ya Mis 20% 10 kq/ha', why: 'Hədəf: qara ləkə. Mis — kontakt qoruyucu: yazın ilk yağışlarından əvvəl yarpaqda qoruyucu təbəqə yaradır.' };
    var EE2 = { k: 'spray', title: 'Çiləmə: Mankozeb + Dodin + Bor + Aminogal', what: 'Mankozeb 2 kq + Dodin (doza etiketə görə) + Bor 1 kq + Aminogal 1 l /ha', alt: 'Bellis (FRAC 7 + 11)', why: 'Hədəf: qara ləkə. Mankozeb — kontakt; Dodin (U12) — DMI-nin əvəzi, davamlılığı azaldır.' };
    var PP = {
      'B': [{ k: 'work', title: 'Sanitariya: xırdalanmamış yerlərdə xırdalama + karbamid', what: 'Xırdalama + Karbamid (doza: aqronom)', why: 'Tumurcuq açılmadan. ' + SANW },
            BORDO,
            { k: 'fert', title: 'Damlama: Humik-fulvik + Kükürd', what: 'Humik-fulvik turşu 20 l + Kükürd 10 kq /ha, damlama', why: 'Torpaq və kök üçün; ikisi birlikdə, yağış dayanandan sonra (plan).' }],
      'C': [{ k: 'spray', title: 'Bordo 50% 5 kq/ha — B–C-də edilməyibsə', what: BORDO.what, alt: BORDO.alt, why: BORDO.why }],
      'C3': [{ k: 'spray', title: 'Çiləmə: Mankozeb 2 kq/ha', what: 'Mankozeb 2 kq/ha', alt: 'Ditianon 500 q', why: 'Hədəf: qara ləkə. Yaşıl uc açılıb — qoruyucu təbəqə kəsilməsin. Mankozeb — kontakt qoruyucu, davamlılıq riski aşağı.' },
             { k: 'spray', title: 'Çiləmə: Yağ + Piriproksifen (quru gündə)', what: 'Yağ 20 l + Piriproksifen 0,5 l /ha', why: 'Hədəf: qışlayan gənə və mənənə yumurtaları. Yağ yumurtaları örtür, piriproksifen yumurtalara təsir edir. D fazasına keçibsə VURMAYIN.', cancelFrom: 'D', cancelNote: 'D fazasına keçibsə vurmayın' }],
      'D': [{ k: 'spray', title: 'Çiləmə: Mankozeb + Penkonazol + Bor və Sink', what: 'Mankozeb 2 kq + Penkonazol 400 q + Bor və Sink 500 q /ha', alt: 'Penkonazol yerinə Difenokonazol 500 q', why: 'Hədəf: qara ləkə, un şehi. Mankozeb — kontakt; penkonazol — sistemik (mövsümün 1-ci DMI-si); bor və sink — çiçəkləməyə hazırlıq.' }],
      'D3': [{ k: 'spray', title: 'Çiləmə: Ditianon + Siprodinil', what: 'Ditianon 500 q + Siprodinil 400 q /ha', alt: 'Siprodinil yerinə Pirimetanil', why: 'Hədəf: qara ləkə. Ditianon — kontakt qoruyucu; siprodinil — yoluxmadan ~48 saat sonraya qədər geri təsir (kitab).' },
             { k: 'fert', title: 'Damlama: Dəmir (EDDHA 6%)', what: 'Dəmir (EDDHA 6%) 25 kq/ha, damlama', why: 'Yarpaq saralmasına qarşı; yarpaq analizinə görə dəyişə bilər (plan).' }],
      'E': [EE2],
      'E2': [EE2, { k: 'fert', title: 'Damlama: MAP 12-61-0', what: 'MAP 12-61-0 25 kq/ha, damlama', why: 'Əsasən fosfor, azotu azdır (plan).' }],
      'F': [{ k: 'spray', title: 'Çiləmə: Ditianon + Difenokonazol + Bor', what: 'Ditianon 500 q + Difenokonazol 500 q + Bor 1 l /ha', alt: 'Embrelia (doza etiketə görə)', why: 'Hədəf: qara ləkə, tozlanma. Difenokonazol — sistemik (2-ci DMI); bor — tozlanma. Çiçəkdə İNSEKTİSİD YOX (arılar).' }],
      'F2': [{ k: 'spray', title: 'Çiləmə: Mankozeb + Swec + Bor', what: 'Mankozeb 2 kq + Swec 0,5 + Bor 1 l /ha', alt: 'Ditianon 500 q + Dodin', why: 'Hədəf: qara ləkə. Swec (siprodinil + fludioksonil) çürümələrə də təsir edir; FRAC 9-un sonuncusu. İNSEKTİSİD YOX.' }],
      'G': [{ k: 'spray', title: 'Çiləmə: Ditianon + Bupirimat + Aminogal', what: 'Ditianon 500 q + Bupirimat 500 q + Aminogal 1 l /ha', alt: 'Bupirimat yerinə Kükürd', why: 'Hədəf: qara ləkə, un şehi. Bupirimat — un şehinə qarşı. İNSEKTİSİD YOX; kaptan hava isinənə kimi yox.' },
            { k: 'fert', title: 'Damlama: MAP 12-61-0 (ikinci)', what: 'MAP 12-61-0 25 kq/ha, damlama', why: 'İkinci MAP, cəmi 50 kq (plan).' }],
      'H': [{ k: 'spray', title: 'Çiləmə: Mankozeb + Kresoksim-metil + Mikroelement', what: 'Mankozeb 2 kq + Kresoksim-metil 300 q + Mikroelement /ha · tələdə kəpənək varsa + Fenoksikarb 600 q', alt: 'Trifloksistrobin 200 q', why: 'Hədəf: qara ləkə, meyvəyeyən. Kresoksim — QoI, ~96 saat geri təsir (kitab), kontaktsız vurulmur. Fenoksikarb — meyvəyeyənə, faydalı həşərata yumşaq.' },
            { k: 'fert', title: 'Damlama: NPK 3-20', what: 'NPK 3-20 25 kq/ha, damlama', why: 'Yazda azotu artırmayın: yumşaq, uzun zoğ qara ləkəyə açıq qalır (plan).' }],
      'I': [{ k: 'spray', title: 'Çiləmə: Kaptan + Tebukonazol', what: 'Kaptan 2 kq (80%) + Tebukonazol 600 q /ha', alt: 'Mankozeb 2 kq', why: 'Hədəf: qara ləkə. Kaptan — kontakt; tebukonazol — 3-cü DMI. Hava isinibsə kaptan olar.' }],
      'J': [{ k: 'spray', title: 'Çiləmə: Kaptan + Kükürd', what: 'Kaptan 3 kq (50%) + Kükürd 4 kq /1 t', alt: 'Ditianon 500 q', why: 'Hədəf: qara ləkə, un şehi. Sistemik yoxdur — fasilə, davamlılığın qarşısını alır.' },
            { k: 'fert', title: 'Damlama: Kalium nitrat', what: 'Kalium nitrat 13-0-46 25 kq/ha, damlama', why: 'Əsas azot mənbəyi burada olsun, əlavə azot verməyin (plan).' }],
      'Payız-1': [{ k: 'fert', title: 'Çiləmə: Borzinc (yığımdan sonra)', what: 'Borzinc 2 kq/ha', why: 'Yığımdan sonra yarpaqdan qidalanma; 2025-də yalnız Galaya vurulub, planda bütün bağa.' },
                  { k: 'fert', title: 'Çiləmə: Dəmir sulfat + Karbamid (Borzinc-dən sonra)', what: 'Dəmir sulfat 15 kq + Karbamid 10 kq /ha', why: 'Planın gübrələmə bölməsi — yığımdan sonra, Borzinc-dən sonra.' }],
      'Payız-2': [{ k: 'work', title: 'Qış sanitariyası: yarpaq xırdalama + karbamid', what: 'Yarpaq döşənəyini xırdalamaq + Karbamid (doza: aqronom)', why: SANW }]
    };
    function phIdx(c) { for (var i = 0; i < PHASES.length; i++) { if (PHASES[i][0] === c) return i; } return -1; }
    function phName(c) { var i = phIdx(c); return i < 0 ? c : PHASES[i][1]; }
    function itemsFor(c) { return PP[c] || []; }
    function nextPhase(c) { var i = phIdx(c); return i >= 0 && i < PHASES.length - 1 ? PHASES[i + 1][0] : null; }
    function getPhase() { try { var v = JSON.parse(window.localStorage.getItem('orchard_phase')); if (v && v.code && phIdx(v.code) >= 0) return v; } catch (e) {} return { code: 'Payız-1', date: null }; }
    function setPhase(c) { try { window.localStorage.setItem('orchard_phase', JSON.stringify({ code: c, date: new Date().toISOString() })); } catch (e) {} }
    function phDate(v) { if (!v.date) return 'nümunə'; var d = new Date(v.date); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
    function phLine(v) { return v.code + ' — ' + phName(v.code) + ' (təsdiq: ' + phDate(v) + ')'; }
    function phaseMatch(s, c) { var toks = String(s).split(/[^A-Za-z0-9]+/); for (var i = 0; i < toks.length; i++) { if (toks[i] === c) return true; } return false; }
    function getMarks() { try { return JSON.parse(window.localStorage.getItem('orchard_marks')) || {}; } catch (e) { return {}; } }
    function setMark(k, v) { var m = getMarks(); if (v) { m[k] = v; } else { delete m[k]; } try { window.localStorage.setItem('orchard_marks', JSON.stringify(m)); } catch (e) {} }
    function itemKey(c, it) { return c + '|' + it.title; }
    function todayStr() { var d = new Date(); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }

    var C = { 'YÜKSƏK': ['#FDEBDD', '#9A3412'], 'ORTA': ['#FDF3D7', '#7A5300'], 'AŞAĞI': ['#E8EEF6', '#284A73'] };
    var ph = getPhase(), raw = [], MARKS = getMarks();
    itemsFor(ph.code).forEach(function (it, i) {
      raw.push({ key: itemKey(ph.code, it), id: i + 1, kind: it.k === 'work' ? 'other' : it.k, kindLabel: it.k === 'spray' ? 'Dərmanlama' : (it.k === 'fert' ? 'Gübrə' : 'Sanitariya'), block: 'Bütün bağ', prio: 'ORTA',
        tag: '★ TÖVSİYƏ · faza ' + ph.code, title: it.title, note: 'Aqronom təsdiqləyib (nümunə). Quru gündə edin.', why: it.why,
        mix: [{ name: it.what, dose: '' }], mixNote: 'Doza plandan · çənə görə miqdarı aqronom yazır · etiketlə yoxlanmalıdır',
        safety: it.k === 'spray' ? 'Qoruyucu geyim, maska, əlcək. Çilədikdən sonra bağa giriş etiketdə yazıldığı qədər qadağandır.' : (it.k === 'fert' ? 'Əlcək taxın.' : null) });
    });
    raw.push({ id: 99, kind: 'other', kindLabel: 'Faza', block: 'Bütün bloklar', prio: 'ORTA', title: 'Faza şəkli çək', note: 'Nişanlı 5 ağacda tumurcuq və yarpaqları yaxından çək.', why: 'faza dəyişəndə plan da dəyişir.' });
    var tasks = raw.map(function (r) {
      var isChem = r.kind !== 'other', mk = r.key ? (MARKS[r.key] || {}) : {}; var s = mk.st === 'done' ? (isChem ? 2 : 1) : (st.step[r.id] || 0);
      var done = isChem ? s === 2 : s >= 1;
      if (done) { n++; if (st.offline) pending++; }
      var label = done ? 'Bitdi ✓ ' + (mk.date || '') : (isChem && s === 1 ? 'Qeyd et' : 'Bitirdim');
      return Object.assign({}, r, {
        chipBg: C[r.prio][0], chipFg: C[r.prio][1], hasTag: !!r.tag, tag: r.tag || '',
        hasWhy: !!r.why, why: r.why || '', hasMix: !!r.mix, mix: r.mix || [], mixNote: r.mixNote || '', hasSafety: !!r.safety, safety: r.safety || '',
        showForm: isChem && s === 1, opacity: done ? '0.6' : '1', strike: done ? 'line-through' : 'none',
        btnLabel: label, btnBg: done ? '#FFFFFF' : '#1F5E3B', btnFg: done ? '#1F5E3B' : '#FFFFFF',
        toggle: function () { var o = Object.assign({}, st.step); var max = isChem ? 2 : 1; var ns = s >= max ? 0 : s + 1; o[r.id] = ns; if (r.key) { setMark(r.key, ns === max ? { st: 'done', date: todayStr(), by: '[işçi 1]' } : null); } self.setState({ step: o }); } });
    });
    var T0 = new Date(), DAY = 864e5; function dd(o) { var d = new Date(T0.getTime() + o * DAY); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
    return { tasks: tasks, doneN: n, total: raw.length, today: dd(0), phaseCode: ph.code,
      netLabel: st.offline ? 'Oflayn · ' + pending + ' gözləyir' : 'Onlayn',
      netBg: st.offline ? '#ECEEEF' : '#E3F1E8', netFg: st.offline ? '#444C52' : '#17603A',
      toggleNet: function () { self.setState({ offline: !st.offline }); } };
  }
}
