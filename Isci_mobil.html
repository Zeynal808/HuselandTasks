<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>İşçi — bugünkü işlər</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5E3B}a:hover{color:#123D26}
button,input{font-family:inherit}
</style>

<style>body{background:#DDE2DD}#dc-root{display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}#dc-root>div{box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:24px}</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:10;background:#123D26;color:#fff;font:600 13px Inter,system-ui,sans-serif;padding:8px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><a href="index.html" style="color:#fff">← Bütün ekranlar</a><span style="opacity:.85">ORCHARD AI — dizayn nümunəsi (DEMO, real məlumat deyil)</span></div>
<template id="dc-template">

<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #16201A; background: #F4F5F2; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #16201A; color: #F4F5F2; padding: 6px 16px; font-size: 12px; display: flex; gap: 8px; align-items: center">
    <span style="background: #F4C542; color: #16201A; font-weight: 700; padding: 1px 6px; border-radius: 4px">DEMO</span><span>Nümunə tapşırıqlar</span>
  </div>
  <header style="padding: 16px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border-bottom: 1px solid #E2E6E2">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 13px; color: #5A665E">Salam, [işçinin adı]</div>
      <span style="font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 99px; background: {{netBg}}; color: {{netFg}}">{{netLabel}}</span>
    </div>
    <h1 style="margin: 0; font-size: 24px; letter-spacing: -0.02em">Bugünkü işlərim</h1>
    <div style="font-size: 14px; color: #33403A">{{doneN}} / {{total}} tamamlandı · 04.04</div>
  </header>
  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <template data-for="tasks" data-as="t">
      <div style="background: #FFFFFF; border: 1px solid #E2E6E2; border-left-width: 1px; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; opacity: {{t.opacity}}">
        <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap">
          <span style="font-size: 13px; color: #5A665E">{{t.kindLabel}} · {{t.block}}</span>
          <span style="font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: {{t.chipBg}}; color: {{t.chipFg}}">{{t.prio}}</span>
        </div>
        <template data-if="t.hasTag">
          <span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 6px; background: #1F5E3B; color: #FFFFFF">{{t.tag}}</span>
        </template>
        <div style="font-size: 18px; font-weight: 600; line-height: 1.3; text-decoration: {{t.strike}}">{{t.title}}</div>
        <div style="font-size: 14px; color: #33403A; line-height: 1.45">{{t.note}}</div>
        <template data-if="t.hasMix">
          <div style="background: #F4F5F2; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
            <template data-for="t.mix" data-as="m">
              <div style="display: flex; justify-content: space-between; gap: 8px"><span>{{m.name}}</span><b style="font-weight: 600; white-space: nowrap">{{m.dose}}</b></div>
            </template>
            <div style="font-size: 12px; color: #5A665E; border-top: 1px solid #E2E6E2; padding-top: 6px">{{t.mixNote}}</div>
          </div>
        </template>
        <template data-if="t.hasSafety">
          <div style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #7A5300; background: #FDF3D7; border-radius: 10px; padding: 8px 10px; line-height: 1.4">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
            <span>{{t.safety}}</span>
          </div>
        </template>
        <template data-if="t.showForm">
          <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #ECEFEC; padding-top: 10px">
            <div style="font-size: 13px; font-weight: 600">Faktiki nə vuruldu?</div>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #33403A">Sərf olunan su, ton
              <input type="text" inputmode="decimal" placeholder="məs. 8" style="min-height: 44px; padding: 0 12px; border: 1px solid #CDD4CE; border-radius: 8px; font-size: 16px"></label>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #33403A">Qeyd (fərq varsa)
              <input type="text" placeholder="məs. siprodinil qurtardı, pirimetanil qoyuldu" style="min-height: 44px; padding: 0 12px; border: 1px solid #CDD4CE; border-radius: 8px; font-size: 15px"></label>
          </div>
        </template>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="min-height: 56px; border-radius: 10px; border: 1px solid #CDD4CE; background: #FFFFFF; color: #16201A; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Foto</button>
          <button type="button" onClick="{{t.toggle}}" style="min-height: 56px; border-radius: 10px; border: 1px solid #1F5E3B; background: {{t.btnBg}}; color: {{t.btnFg}}; font-size: 16px; font-weight: 700">{{t.btnLabel}}</button>
        </div>
      </div>
    </template>
    <button type="button" style="min-height: 56px; border-radius: 12px; border: 1px dashed #1F5E3B; background: transparent; color: #1F5E3B; font-size: 16px; font-weight: 600">+ Müşahidə yaz (xəstəlik, zərərverici)</button>
    <button type="button" onClick="{{toggleNet}}" style="min-height: 44px; border: 0; background: transparent; color: #5A665E; font-size: 13px; text-decoration: underline">İnterneti söndür / yandır (sınaq)</button>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (m && /^(checked|disabled|selected)$/i.test(a.name)) { var bv = !!get(m[1], scopes); el.removeAttribute(a.name); if (bv) el.setAttribute(a.name, ''); return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    comp = new Component({}); window.__dcRender();
  });
})();


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: {}, offline: false }; }
  renderVals() {
    var self = this, st = this.state, n = 0, pending = 0;
    var C = { 'YÜKSƏK': ['#FDEBDD', '#9A3412'], 'ORTA': ['#FDF3D7', '#7A5300'], 'AŞAĞI': ['#E8EEF6', '#284A73'] };
    var raw = [
      { id: 1, kind: 'spray', kindLabel: 'Dərmanlama', block: 'Bütün bağ', prio: 'ORTA', tag: '★ TÖVSİYƏ · düzəldilmiş plan',
        title: 'Çiləmə — D3 fazası', note: 'Aqronom təsdiqləyib: 04.04 09:30. Yağış başlamadan bitirin.',
        mix: [{ name: 'Ditianon', dose: '500 q /ha' }, { name: 'Siprodinil', dose: '400 q /ha' }],
        mixNote: 'Doza təsdiqlənmiş plandan · çəninə görə miqdarı aqronom yazır',
        safety: 'Qoruyucu geyim, maska, əlcək. Çilədikdən sonra bağa giriş qadağası etiketdə yazıldığı qədər.' },
      { id: 2, kind: 'fert', kindLabel: 'Gübrələmə', block: 'Bütün bağ', prio: 'AŞAĞI', tag: '★ TÖVSİYƏ · düzəldilmiş plan',
        title: 'Damlama ilə gübrə — E2', note: 'Suvarma ilə birlikdə verin.',
        mix: [{ name: 'MAP 12-61-0', dose: '25 kq /ha' }], mixNote: 'Plandan · təxminən 09.04, faza təsdiqlənəndə' },
      { id: 3, kind: 'other', kindLabel: 'Faza', block: 'Bütün bloklar', prio: 'ORTA', title: 'Faza şəkli çək', note: 'Nişanlı 5 ağacda tumurcuqları yaxından çək. Aqronom fazanı təsdiqləyəcək.' },
      { id: 4, kind: 'other', kindLabel: 'Sayım', block: 'Gala — Blok 2', prio: 'ORTA', title: 'Qırmızı gənə sayımı', note: '10 ağac, hər ağacdan 10 yarpaq. Sayı formaya yaz.' }
    ];
    var tasks = raw.map(function (r) {
      var s = st.step[r.id] || 0, isChem = r.kind !== 'other';
      var done = isChem ? s === 2 : s >= 1;
      if (done) { n++; if (st.offline) pending++; }
      var label = done ? 'Bitdi ✓' : (isChem && s === 1 ? 'Qeyd et' : 'Bitirdim');
      return Object.assign({}, r, {
        chipBg: C[r.prio][0], chipFg: C[r.prio][1], hasTag: !!r.tag, tag: r.tag || '',
        hasMix: !!r.mix, mix: r.mix || [], mixNote: r.mixNote || '', hasSafety: !!r.safety, safety: r.safety || '',
        showForm: isChem && s === 1, opacity: done ? '0.6' : '1', strike: done ? 'line-through' : 'none',
        btnLabel: label, btnBg: done ? '#FFFFFF' : '#1F5E3B', btnFg: done ? '#1F5E3B' : '#FFFFFF',
        toggle: function () { var o = Object.assign({}, st.step); var max = isChem ? 2 : 1; o[r.id] = s >= max ? 0 : s + 1; self.setState({ step: o }); } });
    });
    return { tasks: tasks, doneN: n, total: raw.length,
      netLabel: st.offline ? 'Oflayn · ' + pending + ' gözləyir' : 'Onlayn',
      netBg: st.offline ? '#ECEEEF' : '#E3F1E8', netFg: st.offline ? '#444C52' : '#17603A',
      toggleNet: function () { self.setState({ offline: !st.offline }); } };
  }
}

</script>
</body>
</html>
