          </div>

    </main>

<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (m && /^(checked|disabled|selected)$/i.test(a.name)) { var bv = !!get(m[1], scopes); el.removeAttribute(a.name); if (bv) el.setAttribute(a.name, ''); return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    var mount = function () { comp = new Component({}); window.__dcRender(); };
    // Server rejimi: api/state varsa, bütün ekranlar eyni (paylaşılan) məlumatla işləyir; yoxdursa (GitHub) — nümunə rejimi
    var done = false, go = function (s) { if (done) return; done = true; window.ORCHARD = (s && s.server) ? s : undefined; mount(); };
    setTimeout(function () { go(null); }, 2500);
    fetch('api/state', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(go);
  });
})();


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'today', sel: null, over: {} }; }
  renderVals() {
    var self = this, st = this.state, T0 = new Date(), DAY = 864e5;
    var PHASES = [['B', 'Tumurcuq şişir'], ['C', 'Yaşıl uc görünür'], ['C3', 'Yaşıl uc açılır'], ['D', 'Yaşıl salxım'], ['D3', 'Salxımda tumurcuqlar ayrılır'],
      ['E', 'Kasa yarpaqları görünür'], ['E2', 'Çəhrayı tumurcuq'], ['F', 'İlk çiçəklər'], ['F2', 'Tam çiçəkləmə'], ['G', 'Ləçəklər tökülür'], ['H', 'Meyvə bağlayır'],
      ['I', 'Meyvə böyüyür (I)'], ['J', 'Meyvə böyüyür (J)'], ['Payız-1', 'Yarpaqlar saralır'], ['Payız-2', 'Yarpaqların ~95%-i töküldü']];

    var BORDO = { k: 'spray', title: 'Çiləmə: Bordo 50% 5 kq/ha', what: 'Bordo 50% 5 kq/ha, yağışdan əvvəl', alt: 'Mis 50% 5 kq/ha və ya Mis 20% 10 kq/ha', why: 'Hədəf: qara ləkə. Mis — kontakt qoruyucu: yazın ilk yağışlarından əvvəl yarpaqda qoruyucu təbəqə yaradır.' };
    var EE2 = { k: 'spray', title: 'Çiləmə: Mankozeb + Dodin + Bor + Aminogal', what: 'Mankozeb 2 kq + Dodin (doza etiketə görə) + Bor 1 kq + Aminogal 1 l /ha', alt: 'Bellis (FRAC 7 + 11)', why: 'Hədəf: qara ləkə. Mankozeb — kontakt; Dodin (U12) — DMI-nin əvəzi, davamlılığı azaldır.' };
    var PP = {
      'B': [{ k: 'work', title: 'Sanitariya: xırdalanmamış yerlərdə xırdalama + karbamid', what: 'Xırdalama + Karbamid (doza: aqronom)', why: 'Tumurcuq açılmadan. ' + SANW },
            BORDO,
            { k: 'fert', title: 'Damlama: Humik-fulvik + Kükürd', what: 'Humik-fulvik turşu 20 l + Kükürd 10 kq /ha, damlama', why: 'Torpaq və kök üçün; ikisi birlikdə, yağış dayanandan sonra (plan).' }],
      'C': [{ k: 'spray', title: 'Bordo 50% 5 kq/ha — B–C-də edilməyibsə', what: BORDO.what, alt: BORDO.alt, why: BORDO.why }],
      'C3': [{ k: 'spray', title: 'Çiləmə: Mankozeb 2 kq/ha', what: 'Mankozeb 2 kq/ha', alt: 'Ditianon 500 q', why: 'Hədəf: qara ləkə. Yaşıl uc açılıb — qoruyucu təbəqə kəsilməsin. Mankozeb — kontakt qoruyucu, davamlılıq riski aşağı.' },
             { k: 'spray', title: 'Çiləmə: Yağ + Piriproksifen (quru gündə)', what: 'Yağ 20 l + Piriproksifen 0,5 l /ha', why: 'Hədəf: qışlayan gənə və mənənə yumurtaları. Yağ yumurtaları örtür, piriproksifen yumurtalara təsir edir. D fazasına keçibsə VURMAYIN.', cancelFrom: 'D', cancelNote: 'D fazasına keçibsə vurmayın' }],
      'D': [{ k: 'spray', title: 'Çiləmə: Mankozeb + Penkonazol + Bor və Sink', what: 'Mankozeb 2 kq + Penkonazol 400 q + Bor və Sink 500 q /ha', alt: 'Penkonazol yerinə Difenokonazol 500 q', why: 'Hədəf: qara ləkə, un şehi. Mankozeb — kontakt; penkonazol — sistemik (mövsümün 1-ci DMI-si); bor və sink — çiçəkləməyə hazırlıq.' }],
      'D3': [{ k: 'spray', title: 'Çiləmə: Ditianon + Siprodinil', what: 'Ditianon 500 q + Siprodinil 400 q /ha', alt: 'Siprodinil yerinə Pirimetanil', why: 'Hədəf: qara ləkə. Ditianon — kontakt qoruyucu; siprodinil — yoluxmadan ~48 saat sonraya qədər geri təsir (kitab).' },
             { k: 'fert', title: 'Damlama: Dəmir (EDDHA 6%)', what: 'Dəmir (EDDHA 6%) 25 kq/ha, damlama', why: 'Yarpaq saralmasına qarşı; yarpaq analizinə görə dəyişə bilər (plan).' }],
      'E': [EE2],
