<body>
<div style="position:sticky;top:0;z-index:10;background:#123D26;color:#fff;font:600 13px Inter,system-ui,sans-serif;padding:8px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><a href="index.html" style="color:#fff">← Bütün ekranlar</a><span style="opacity:.85">ORCHARD AI — dizayn nümunəsi (DEMO, real məlumat deyil)</span></div>
<template id="dc-template">

<div style="font-family: Inter, system-ui, sans-serif; color: #16201A; background: #F4F5F2; min-height: 100vh; font-feature-settings: 'tnum' 1">

  </div>
  <div style="display: flex; flex-wrap: wrap; align-items: stretch">
    <nav aria-label="Əsas menyu" style="flex: 1 1 220px; max-width: 260px; min-width: 200px; background: #FFFFFF; border-right: 1px solid #E2E6E2; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5E3B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7c-3.5-2-8 0-8 5s3 9 6 9c1 0 1.5-.5 2-.5s1 .5 2 .5c3 0 6-4 6-9s-4.5-7-8-5z"></path><path d="M12 7c0-2 1-4 3-5"></path></svg>
        <div style="font-weight: 700; font-size: 17px">ORCHARD AI</div>
      </div>
      <a href="Main.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Ana səhifə</a>
      <a href="Xerite.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Xəritə və bloklar</a>
      <a href="Qara_leke.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Risklər</a>
      <a href="Dermanlama.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Dərmanlama və gübrə</a>
      <a href="Isci_mobil.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Tapşırıqlar</a>
      <a href="Sensorlar.html" style="padding: 10px 12px; border-radius: 8px; background: #E7EFE9; color: #123D26; font-weight: 600; text-decoration: none; font-size: 15px">Sensorlar</a>
      <a href="Qayda_tesdiqi.html" style="padding: 10px 12px; border-radius: 8px; color: #33403A; text-decoration: none; font-size: 15px">Qaydalar və kitab</a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; padding: 24px; box-sizing: border-box">
      <div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
        <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1 style="margin: 0; font-size: 26px; letter-spacing: -0.02em">Sensorlar</h1>
            <div style="font-size: 14px; color: #5A665E">9 sensor · 8 işləyir · 1 nasaz</div>
          </div>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #1F5E3B; background: #1F5E3B; color: #FFFFFF; font-size: 14px; font-weight: 600">+ Cihaz qoş</button>
        </header>

        <section aria-label="Sensorların siyahısı" style="background: #FFFFFF; border: 1px solid #E2E6E2; border-radius: 14px; overflow-x: auto">
          <table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px">
            <thead>
              <tr style="text-align: left; color: #5A665E; font-size: 12px; letter-spacing: 0.03em">
                <th style="padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #E2E6E2">SENSOR</th>
                <th style="padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #E2E6E2">BLOK</th>
                <th style="padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #E2E6E2">SON ÖLÇMƏ</th>
                <th style="padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #E2E6E2">KEYFİYYƏT</th>
                <th style="padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #E2E6E2">BATAREYA</th>
                <th style="padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #E2E6E2">KALİBRLƏMƏ</th>
                <th style="padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #E2E6E2">24 SAAT</th>
              </tr>
            </thead>
            <tbody>
              <template data-for="rows" data-as="r">
                <tr>
                  <td style="padding: 12px 16px; border-bottom: 1px solid #ECEFEC"><div style="font-weight: 600">{{r.id}}</div><div style="font-size: 12px; color: #5A665E">{{r.kind}}</div></td>
                  <td style="padding: 12px 16px; border-bottom: 1px solid #ECEFEC">{{r.block}}</td>
                  <td style="padding: 12px 16px; border-bottom: 1px solid #ECEFEC; color: {{r.ageFg}}; font-weight: {{r.ageW}}">{{r.age}}</td>
                  <td style="padding: 12px 16px; border-bottom: 1px solid #ECEFEC"><span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: {{r.qBg}}; color: {{r.qFg}}">{{r.q}}</span></td>
                  <td style="padding: 12px 16px; border-bottom: 1px solid #ECEFEC">{{r.batt}}</td>
                  <td style="padding: 12px 16px; border-bottom: 1px solid #ECEFEC; color: {{r.calFg}}">{{r.cal}}</td>
                  <td style="padding: 12px 16px; border-bottom: 1px solid #ECEFEC">
                    <svg width="120" height="28" viewBox="0 0 120 28" aria-hidden="true"><polyline fill="none" stroke="{{r.sparkColor}}" stroke-width="2" stroke-linejoin="round" points="{{r.spark}}"></polyline></svg>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </section>

        <div style="display: flex; flex-wrap: wrap; gap: 20px">
          <section aria-labelledby="new-h" style="flex: 1 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E6E2; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
            <h2 id="new-h" style="margin: 0; font-size: 18px">Yeni cihaz necə qoşulur</h2>
            <ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5; color: #33403A">
              <li>"Cihaz qoş" düyməsini basın, növü seçin: ESP32, LoRaWAN, yaxud hazır stansiya (Pessl, Davis, Ecowitt).</li>
              <li>Sistem cihaz üçün ayrıca açar verir. Açarı cihazın proqramına yazın.</li>
              <li>Cihazın yerini xəritədə qeyd edin. Yarpaq islanma sensorunun hündürlüyünü və çətirdəki yerini yazın.</li>
              <li>İlk ölçmə gələndə cihaz bu siyahıda görünür və keyfiyyət yoxlaması başlayır.</li>
            </ol>
          </section>
          <section aria-labelledby="q-h" style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E6E2; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
            <h2 id="q-h" style="margin: 0; font-size: 18px">Keyfiyyət nişanları</h2>
            <div style="display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; font-size: 14px; align-items: center">
              <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #E3F1E8; color: #17603A">OK</span><span>ölçmə normaldır</span>
              <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #FDF3D7; color: #7A5300">ŞÜBHƏLİ</span><span>sıçrayış, donmuş dəyər və ya qonşu sensorla uyğunsuzluq</span>
              <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #E8EEF6; color: #284A73">TƏXMİNİ</span><span>qısa boşluq interpolyasiya ilə doldurulub</span>
              <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #ECEEEF; color: #444C52">KÖHNƏ</span><span>məlumat gecikir — risk hesablanmır</span>
              <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #FDE8E7; color: #9F1C14">NASAZ</span><span>fiziki mümkün olmayan dəyər və ya cihaz susur</span>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, p); window.__dcRender(); } forceUpdate(){ window.__dcRender(); } }
(function(){
  function get(path, scopes){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], parts[0])) {
        var v = scopes[i]; for (var j = 0; j < parts.length; j++) { v = v == null ? undefined : v[parts[j]]; } return v; } }
    return undefined;
  }
  var whole = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scopes){ return s.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = get(p, scopes); return v == null ? '' : String(v); }); }
  function build(node, scopes, out){
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scopes))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'template' && node.hasAttribute('data-for')) {
      var list = get(node.getAttribute('data-for'), scopes) || [], as = node.getAttribute('data-as') || 'item';
      list.forEach(function(item, idx){ var sc = {}; sc[as] = item; sc.$index = idx;
        kids(node.content, [sc].concat(scopes), out); });
      return; }
    if (tag === 'template' && node.hasAttribute('data-if')) {
      if (get(node.getAttribute('data-if'), scopes)) kids(node.content, scopes, out); return; }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var m = a.value.match(whole);
      if (/^on/i.test(a.name)) { el.removeAttribute(a.name);
        if (m) { var fn = get(m[1], scopes); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); } return; }
      if (a.value.indexOf('{{') >= 0) el.setAttribute(a.name, interp(a.value, scopes));
    });
    kids(node, scopes, el); out.appendChild(el);
  }
  function kids(parent, scopes, out){ Array.prototype.forEach.call(parent.childNodes, function(c){ build(c, scopes, out); }); }
  var comp = null, tpl = null, root = null;
  window.__dcRender = function(){
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment(); kids(tpl.content, [vals], frag);
    root.replaceChildren(frag);
  };
  document.addEventListener('DOMContentLoaded', function(){
    tpl = document.getElementById('dc-template'); root = document.getElementById('dc-root');
    comp = new Component({}); window.__dcRender();
  });
})();


class Component extends DCLogic {
  renderVals() {
    var Q = { OK: ['#E3F1E8', '#17603A'], 'ŞÜBHƏLİ': ['#FDF3D7', '#7A5300'], NASAZ: ['#FDE8E7', '#9F1C14'] };
    var wave = '0,18 15,16 30,14 45,15 60,12 75,10 90,11 105,9 120,8';
    var flat = '0,14 15,14 30,14 45,14 60,14 75,14 90,14 105,14 120,14';
    var gap = '0,16 15,14 30,15 45,14';
    var data = [
      ['WS-01', 'Meteostansiya (T, RH)', 'Fuji — Blok 1', '3 dəq', 'OK', '87%', '01.03.2026', wave],
      ['RG-01', 'Yağış ölçən', 'Fuji — Blok 1', '3 dəq', 'OK', '87%', '01.03.2026', '0,24 15,24 30,20 45,12 60,16 75,18 90,14 105,20 120,22'],
      ['LW-01', 'Yarpaq islanması', 'Fuji — Blok 1', '3 dəq', 'OK', '74%', '01.03.2026', '0,22 15,22 30,6 45,6 60,6 75,6 90,6 105,6 120,6'],
      ['LW-02', 'Yarpaq islanması', 'Gala — Blok 2', '5 dəq', 'OK', '69%', '01.03.2026', '0,22 15,22 30,22 45,6 60,6 75,6 90,6 105,6 120,6'],
      ['LW-03', 'Yarpaq islanması', 'Granny Smith — Blok 3', '4 dəq', 'OK', '81%', '01.03.2026', '0,22 15,6 30,6 45,22 60,22 75,22 90,22 105,22 120,22'],
      ['LW-04', 'Yarpaq islanması', 'Story — Blok 4', '26 saat əvvəl', 'NASAZ', '4%', '01.03.2026', gap],
      ['SM-01', 'Torpaq nəmliyi 20/40 sm', 'Fuji — Blok 1', '15 dəq', 'OK', '92%', '15.02.2026', flat],
      ['SM-02', 'Torpaq nəmliyi 20/40 sm', 'Gala — Blok 2', '15 dəq', 'ŞÜBHƏLİ', '90%', '15.02.2025', flat],
      ['WS-02', 'Meteostansiya (T, RH)', 'Story — Blok 4', '6 dəq', 'OK', '78%', '01.03.2026', wave]
    ];
    var rows = data.map(function (d) {
      var q = Q[d[4]], late = d[3].indexOf('saat') >= 0, oldCal = d[6].slice(-4) === '2025';
      return { id: d[0], kind: d[1], block: d[2], age: d[3], q: d[4] === 'ŞÜBHƏLİ' ? 'ŞÜBHƏLİ · donmuş' : d[4],
        qBg: q[0], qFg: q[1], batt: d[5], cal: oldCal ? d[6] + ' · müddəti keçib' : d[6], calFg: oldCal ? '#9F1C14' : '#16201A',
        ageFg: late ? '#9F1C14' : '#16201A', ageW: late ? '600' : '400', spark: d[7], sparkColor: late ? '#9F1C14' : '#33403A' };
    });
    return { rows: rows };
  }
}

</script>
